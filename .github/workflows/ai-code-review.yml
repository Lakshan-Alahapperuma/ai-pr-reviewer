name: AI Security Gate & PR Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai_review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Reviewer Dependencies
        run: |
          pip install google-genai pydantic python-dotenv rich

      - name: Generate PR Git Diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr.diff

      - name: Run AI Reviewer & Security Gate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python cli.py --file pr.diff --output-markdown pr_comment.md --fail-on-block

      - name: Post Comment to PR
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (fs.existsSync('pr_comment.md')) {
              const body = fs.readFileSync('pr_comment.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
